# The one strong dungeon run: 18.5M-parameter EDM U-Net, 4-frame context, context noise.
[train]
data = "data/dungeon"
out = "runs/dungeon"
seed = 0
context = 4
channels = [96, 192, 256]
blocks = 2
attn_levels = [2]
batch = 128
lr = 3e-4
warmup = 500
max_steps = 24000
max_minutes = 46.0
ema = 0.999
ctx_noise_max = 0.3
ctx_noise_zero_prob = 0.1
holdout_episodes = 16
log_every = 50
ckpt_every = 2000
