[project]
name = "dreamcade"
version = "0.1.0"
description = "Arcade games that run entirely inside a neural network, including a 3D dungeon crawler."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aamod Bhatt" }]
requires-python = ">=3.12,<3.13"
# The base install only serves the browser player and runs the game engines; everything
# that needs PyTorch lives in the `ml` extra so `uv run dreamcade play` stays tiny.
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
ml = [
  "torch==2.14.1",
  "torchvision",
  "lpips>=0.1.4",
  "matplotlib>=3.9",
  "pillow>=11.0",
  "onnx>=1.17",
  "onnxscript>=0.2",
  "onnxruntime>=1.20",
]

[project.scripts]
dreamcade = "dreamcade.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
]
capture = ["playwright>=1.49", "pillow>=11.0"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamcade"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "NPY", "PL", "C4", "PIE", "RET", "TID"]
ignore = [
  "PLR0913",  # model/config constructors legitimately take many arguments
  "PLR2004",  # small geometric constants are clearer inline in game rules
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "PLC0415",  # heavy ML imports are deliberately lazy so `dreamcade play` needs only numpy
  "N806",     # B, T, H, W tensor dimension names
  "N812",
  "PLR0917",  # tensors-in, tensor-out model and eval functions read best with positional arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/dreamcade", "tests", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnxscript.*", "matplotlib.*", "playwright.*", "lpips.*", "torchvision.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests excluded from the default suite (run with -m slow)"]
filterwarnings = ["ignore::DeprecationWarning:onnxscript.*", "ignore::UserWarning:torchvision.*"]
